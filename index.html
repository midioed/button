<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>지아의 도망가는 버튼 잡기</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9f5;color:#493b38;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;text-align:center}main{width:min(100%,520px);margin:auto;padding:18px 16px 30px}.tag{font-size:13px;color:#a0756a;font-weight:800;letter-spacing:.06em}h1{font-size:clamp(27px,7vw,37px);line-height:1.2;margin:8px 0;color:#473737}h1 span{color:#f07779}.sub{color:#7c6b65;font-size:15px;line-height:1.55}.card{background:white;border:1px solid #f3e5dd;border-radius:24px;padding:20px;box-shadow:0 8px 25px #b47e6715}button{font:inherit;cursor:pointer;border:0}.primary{background:#f47f83;color:white;font-weight:850;border-radius:16px;padding:15px 24px;box-shadow:0 5px 0 #d6656a;font-size:18px}.secondary{background:#fff1d1;color:#665040;font-weight:750;border-radius:14px;padding:12px 18px}.mascot{font-size:56px;margin:8px}.rules{background:#fff9ed;border-radius:16px;padding:14px;line-height:1.8;font-size:15px;text-align:left;margin:16px 0}.stats{display:flex;justify-content:space-between;gap:6px;margin:12px 0;font-weight:800;font-size:14px}.stats{flex-wrap:wrap}.stats span{min-width:21%;background:#fff;border-radius:12px;padding:9px;flex:1}.arena{position:relative;height:min(49vh,390px);min-height:260px;border:2px solid #f5dcd5;border-radius:22px;background:linear-gradient(145deg,#fffdf7,#fff2f2);overflow:hidden;touch-action:manipulation}.target.ready{background:#f47f83;color:#fff;box-shadow:0 5px 0 #d6656a}.target{position:absolute;width:122px;height:56px;border-radius:16px;background:#ffe390;color:#5c473b;font-size:18px;font-weight:900;box-shadow:0 5px 0 #e5b965;touch-action:manipulation;transition:left .85s linear,top .85s linear;user-select:none}.notice{min-height:50px;padding:12px 0;color:#a06468;font-weight:800;line-height:1.4}.progress{display:flex;justify-content:center;gap:8px;margin:10px}.dot{width:12px;height:12px;background:#eadbd7;border-radius:50%}.dot.on{background:#f47f83}.hide{display:none!important}.result h2{font-size:25px}.record{background:#fff4e6;padding:16px;border-radius:16px;margin:15px 0;font-weight:800}.foot{font-size:12px;color:#ae9c95;margin-top:22px}button:focus-visible{outline:3px solid #8970a4;outline-offset:4px}
@keyframes levelup{0%{transform:scale(1);background:#fff}40%{transform:scale(1.16);background:#ffd68a;color:#9c4c42}100%{transform:scale(1);background:#fff}}.level-up{animation:levelup .7s ease} .confetti{position:fixed;z-index:20;top:-16px;pointer-events:none;width:9px;height:15px;border-radius:3px;animation:fall 2.5s ease-in forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(700deg);opacity:0}}@media(prefers-reduced-motion:reduce){.confetti{animation-duration:.4s}}</style></head><body><main><div class="tag">지아의 디지털 놀이터</div><h1>도망가는 <span>버튼 잡기!</span></h1><p class="sub">앗, 누르려는데 또 도망갔다!<br>당신은 이 버튼을 잡을 수 있을까요?</p><section id="home" class="card"><div class="mascot">🏃‍♀️💨</div><strong>8단계 버튼 잡기 도전!</strong><div class="rules">👀 버튼은 멈추지 않고 계속 움직여요!<br>🎯 버튼이 <b>분홍색</b>일 때 재빨리 눌러요.<br>⏱️ 40초 동안 버튼을 최대한 많이 잡아요!<br>🔥 5단계부터 버튼이 점점 작아져요!</div><button class="primary" id="start">게임 시작!</button><p id="bestHome" class="sub"></p></section><section id="play" class="hide"><div class="stats"><span id="level">1단계</span><span id="time">⏱ 40초</span><span id="count">도전 0번</span><span id="success">성공 0번</span></div><div class="progress" aria-label="단계 진행"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div id="arena" class="arena"><button id="target" class="target">눌러봐!</button></div><div id="notice" class="notice" aria-live="polite">버튼을 잡아보세요!</div><button id="quit" class="secondary">처음으로</button></section><section id="result" class="card result hide"><div id="resultIcon" class="mascot"></div><h2 id="resultTitle"></h2><p id="resultText" class="sub"></p><div id="record" class="record"></div><button id="again" class="primary">다시 도전!</button><p><button id="copy" class="secondary">결과 복사하기</button></p><p id="copyMsg" class="sub" aria-live="polite"></p></section><p class="foot">지아의 디지털 일상툰 · 버튼 잡기 게임</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),home=$('home'),play=$('play'),result=$('result'),arena=$('arena'),target=$('target'),notice=$('notice');let level=1,tries=0,successes=0,audio=null,deadline=0,timer=null,mover=null,windowTimer=null,active=false,ready=false,lastPos=null,elapsed=0;const storage='jia_button_best_count_v1';const config=[{move:850,open:1100,wait:1000,size:122},{move:730,open:950,wait:1000,size:122},{move:630,open:850,wait:1000,size:122},{move:540,open:750,wait:1000,size:122},{move:370,open:650,wait:1000,size:108},{move:310,open:575,wait:1000,size:96},{move:260,open:500,wait:1000,size:84},{move:220,open:425,wait:1000,size:72}];function best(){try{return Number(localStorage.getItem(storage))||0}catch(e){return 0}}function clearAll(){clearInterval(timer);clearInterval(mover);clearTimeout(windowTimer)}function showHome(){active=false;clearAll();home.classList.remove('hide');play.classList.add('hide');result.classList.add('hide');$('bestHome').textContent=best()?`🏆 내 최고 기록 ${best()}번 성공`:''}function position(){const w=Math.max(0,arena.clientWidth-target.offsetWidth-12),h=Math.max(0,arena.clientHeight-target.offsetHeight-12);let x,y,i=0;do{x=6+Math.random()*w;y=6+Math.random()*h;i++}while(lastPos&&Math.hypot(x-lastPos.x,y-lastPos.y)<Math.min(w,h)*.35&&i<20);lastPos={x,y};target.style.left=x+'px';target.style.top=y+'px'}function update(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('time').textContent='⏱ '+left+'초';if(left<=0&&active)finish()}function setMoving(){if(!active)return;clearInterval(mover);ready=false;target.classList.remove('ready');target.textContent='잡아봐!';notice.textContent='노란색일 땐 도망가요! 분홍색을 기다려요 👀';position();mover=setInterval(position,config[level-1].move);windowTimer=setTimeout(openWindow,config[level-1].wait)}function openWindow(){if(!active)return;ready=true;target.classList.add('ready');target.textContent='지금 잡아!';notice.textContent='지금이에요! 분홍 버튼을 눌러요!';windowTimer=setTimeout(()=>{if(active&&ready){notice.textContent='앗, 놓쳤다! 다시 노려봐요';setMoving()}},config[level-1].open)}function stage(){clearInterval(mover);clearTimeout(windowTimer);lastPos=null;target.style.transition=`left ${config[level-1].move}ms linear, top ${config[level-1].move}ms linear`;target.style.width=config[level-1].size+'px';target.style.height=(level>=7?46:52)+'px';target.style.fontSize=(level>=7?14:16)+'px';$('level').textContent=level+'단계';$('level').classList.remove('level-up');void $('level').offsetWidth;$('level').classList.add('level-up');document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<level));setMoving()}function start(){clearAll();level=1;tries=0;successes=0;active=true;deadline=Date.now()+40000;$('success').textContent='성공 0번';try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}$('count').textContent='도전 0번';home.classList.add('hide');result.classList.add('hide');play.classList.remove('hide');stage();update();timer=setInterval(update,100)}function tone(freq,offset,duration){if(!audio)return;try{const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime+offset;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.13,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+duration+.02)}catch(e){}}function celebrate(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.13,.22));const colors=['#f47f83','#ffd467','#9bd9b6','#9fc7ed','#c5a6e4'];for(let i=0;i<48;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.setProperty('--drift',(Math.random()*180-90)+'px');e.style.animationDelay=(Math.random()*.9)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}function finish(){active=false;clearAll();play.classList.add('hide');result.classList.remove('hide');const cleared=level>=8;$('resultIcon').textContent=cleared?'🎉':'😢';$('resultTitle').textContent=cleared?'40초 도전 완료!':'실패!';$('resultText').textContent=cleared?`버튼을 ${successes}번 잡았어요!`:`8단계에 도달하지 못했어요. 버튼을 ${successes}번 잡았어요!`;if(successes>best())try{localStorage.setItem(storage,String(successes))}catch(e){}$('record').textContent=`👆 도전 ${tries}번 · 🎯 성공 ${successes}번`;$('copyMsg').textContent='';$('copy').dataset.text=`지아의 도망가는 버튼 잡기! 40초 동안 ${successes}번 성공! 너도 도전해봐!`;if(cleared)celebrate();else [392,330,262].forEach((f,i)=>tone(f,i*.18,.24))}function attempt(e){if(!active)return;if(Date.now()>=deadline){finish();return}tries++;$('count').textContent='도전 '+tries+'번';if(!target.contains(e.target)){notice.textContent='앗, 빗나갔어요! 다시 도전!';return}if(!ready){position();notice.textContent='앗! 아직 노란색이에요. 분홍색을 노려요!';return}successes++;$('success').textContent='성공 '+successes+'번';tone(659,0,.12);tone(988,.1,.2);ready=false;clearTimeout(windowTimer);clearInterval(mover);level=Math.min(8,successes+1);stage()}arena.addEventListener('pointerdown',attempt);arena.addEventListener('click',e=>{if(e.detail===0)attempt(e)});$('start').onclick=start;$('again').onclick=start;$('quit').onclick=showHome;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('copy').dataset.text);$('copyMsg').textContent='결과를 복사했어요! 친구에게 붙여넣어 보세요.'}catch(e){$('copyMsg').textContent='복사가 안 되면 결과를 화면 캡처로 공유해 주세요.'}};window.addEventListener('resize',()=>{if(active)position()});showHome()})();
</script></body></html>
